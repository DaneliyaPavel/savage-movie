name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Еженедельный аудит по понедельникам в 09:00 UTC
    - cron: '0 9 * * 1'

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Блокирует только то, что попадает в production-образ.
      - name: Run npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      # braces (GHSA-vfj7-8cjw-p6xm) приходит только через eslint-config-next,
      # исправленной версии нет. Остаётся видимым в логе, но сборку не роняет.
      - name: Report npm audit (dev dependencies, non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true

  pip-audit:
    name: pip audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip audit
        run: pip-audit -r backend/requirements.txt

  gitleaks:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: Container scan
    runs-on: ubuntu-latest
    needs: [npm-audit, pip-audit]
    steps:
      - uses: actions/checkout@v5

      - name: Build backend image
        run: docker build -f Dockerfile.backend -t savage-backend:audit .

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: savage-backend:audit
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
