# Redirect www to non-www
server {
    listen 80;
    listen 443 ssl;
    server_name www.savagemovie.ru;

    ssl_certificate /etc/ssl/origin.pem;
    ssl_certificate_key /etc/ssl/origin-key.pem;

    return 301 https://savagemovie.ru$request_uri;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name savagemovie.ru;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl;
    server_name savagemovie.ru;

    # Cloudflare Origin Certificate
    ssl_certificate /etc/ssl/origin.pem;
    ssl_certificate_key /etc/ssl/origin-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Max upload size
    client_max_body_size 100M;

    # Next.js API routes (handled by frontend, not backend)
    location /api/contact {
        proxy_pass http://frontend:3000/api/contact;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Only /api/auth/session is a Next.js route (cookie management).
    # All other /api/auth/* routes (login, register, me, oauth) go to FastAPI backend.
    location /api/auth/session {
        proxy_pass http://frontend:3000/api/auth/session;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/payments/ {
        proxy_pass http://frontend:3000/api/payments/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File upload POST endpoints (backend FastAPI)
    location /api/upload/ {
        proxy_pass http://backend:8000/api/upload/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }

    # Uploaded file serving (Next.js API route)
    location /api/uploads/ {
        proxy_pass http://frontend:3000/api/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API (all other /api/ routes go to FastAPI)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running API calls
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Backend uploads
    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache static uploads
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Next.js frontend
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Next.js HMR)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Static fonts - long cache
    location /fonts/ {
        proxy_pass http://frontend:3000/fonts/;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Static assets (favicon, logo, etc.)
    location ~* \.(svg|png|ico|webp|jpg|jpeg)$ {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Next.js static assets
    location /_next/static/ {
        proxy_pass http://frontend:3000/_next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
}
