# Формы сайта: не больше 10 заявок в минуту с одного IP (без этого ящик hello@ можно залить спамом)
limit_req_zone $binary_remote_addr zone=forms:2m rate=10r/m;

# Заявка со сметой (/api/estimate) — главный путь лидов. Своя зона, а не общая forms:
# поток на подписку или контакты не должен съедать ни лимит этого же IP (мобильные
# операторы раздают один адрес многим людям), ни память общей зоны.
limit_req_zone $binary_remote_addr zone=estimate:2m rate=10r/m;

# Публичная загрузка брифа: 5 файлов в минуту с одного IP (приложение дополнительно
# держит свои 5 в час). limit_req отбивает лишние попытки до того, как тело прочитано
# и записано во временный файл.
limit_req_zone $binary_remote_addr zone=brief_upload:2m rate=5r/m;

# Загрузки админки (/api/upload/ кроме брифа). Бэкенд и так пускает админа не чаще 10 в
# минуту, так что 30 в минуту с запасом burst ему не мешают. Нужны они против чужих тел
# по 100 МБ: токен проверяет только FastAPI, когда nginx уже принял всё тело, а бэкенд его
# разобрал. Зона upload_conn ограничивает число тел, которые с одного IP принимаются
# одновременно, то есть место под временные файлы.
limit_req_zone $binary_remote_addr zone=upload:2m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=upload_conn:2m;

# 1 = запрос на /api/upload/ без заголовка Authorization: его отбивает сам nginx, не читая
# тела. Админка шлёт Bearer-токен на каждую загрузку (lib/api/base.ts), другой авторизации
# у бэкенда нет (HTTPBearer). Без токена бэкенд тоже ответит 401, но только после того, как
# nginx принял всё тело, а FastAPI его разобрал. Ключ — «метод:заголовок», правила
# проверяются по порядку. OPTIONS пропускаем: CORS-preflight приходит без Authorization.
# Это отсев безымянных клиентов, а не проверка токена: настоящую делает FastAPI.
map "$request_method:$http_authorization" $upload_without_token {
    default       0;
    "~^OPTIONS:"  0;
    "~^[^:]+:$"   1;
}

# Redirect www to non-www
server {
    listen 80;
    listen 443 ssl;
    server_name www.savagemovie.ru;

    ssl_certificate /etc/letsencrypt/live/savagemovie.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/savagemovie.ru/privkey.pem;

    return 301 https://savagemovie.ru$request_uri;
}

# Redirect HTTP to HTTPS (with ACME challenge support)
server {
    listen 80;
    server_name savagemovie.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl;
    server_name savagemovie.ru;

    # Let's Encrypt Certificate
    ssl_certificate /etc/letsencrypt/live/savagemovie.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/savagemovie.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Тело запроса по умолчанию: 2 МБ. Всё, что ходит на сайт, кроме файлов, — это
    # JSON в несколько КБ (формы, вход, правки CMS). Раньше здесь стояло 100M, и любой
    # анонимный POST буферизовался целиком, а Next.js разбирал его одним потоком.
    # Больше 2 МБ разрешено только там, где реально льют файлы: /api/upload/ (админка)
    # и /api/upload/brief (публичный бриф). Исключения заданы в блоках этих локаций.
    client_max_body_size 2m;

    # Bunny CDN proxy — avoids b-cdn.net CNAME blocked by Russian ISPs
    location ^~ /cdn/ {
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        resolver_timeout 5s;

        set $bunny_upstream "vz-a08b303a-cb8.b-cdn.net";
        rewrite ^/cdn/(.*) /$1 break;
        proxy_pass https://$bunny_upstream;
        proxy_set_header Host vz-a08b303a-cb8.b-cdn.net;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_buffering on;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
    }

    # Веб-видео и постеры (docs/media-pipeline.md): hero-превью, постеры, превью проектов.
    #
    # Имена файлов содержат хеш содержимого (name.<hash>.mp4), поэтому кеш вечный.
    # Файлы из тома /var/www/savage-media отдаёт сам nginx (Range/206 из коробки,
    # Safari без 206 видео не играет); если файла в томе нет, запрос уходит на
    # фронтенд — там лежит набор из git (public/media). Так большие превью можно
    # выложить на сервер без пересборки образа, а hero работает и без тома.
    #
    # ^~ обязателен: иначе regex статики (.webp/.jpg ниже) перехватит постеры и
    # отдаст их с кешем в 30 дней вместо вечного.
    #
    # Cache-Control БЕЗ always: add_header и так ставит заголовок на 200/206/304,
    # а always добавил бы вечный кеш ещё и на 403/404/5xx. Если манифест окажется
    # раньше файлов, ошибка закрепилась бы в браузерах на год.
    location ^~ /media/ {
        root /srv;
        try_files $uri @media_frontend;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location @media_frontend {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Заголовок кеша не трогаем: на успех фронтенд сам отдаёт immutable
        # (next.config.ts, headers для /media), а его 404 остаётся no-store
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Next.js API routes (handled by frontend, not backend)
    #
    # Каждый роут Next.js нужен здесь явно: ниже стоит catch-all location /api/,
    # который уводит всё остальное на FastAPI. Забыть блок = роут молча уходит
    # на бэкенд и отвечает 404, хотя в коде он есть.
    location /api/contact {
        proxy_pass http://frontend:3000/api/contact;
        limit_req zone=forms burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Подписка на рассылку: Next.js сохраняет адрес через бэкенд и шлёт уведомление
    location /api/subscribe {
        proxy_pass http://frontend:3000/api/subscribe;
        limit_req zone=forms burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Заявка на предварительную смету с коммерческого лендинга /reklamny-rolik.
    # Настоящая заявка — 1-3 КБ JSON, даже с длинным комментарием она укладывается в 64k.
    # Без лимита сюда можно было отправить тело в десятки МБ: Next.js разбирает его в
    # единственном процессе, который отдаёт весь сайт. Адрес клиента ниже передаём как
    # $remote_addr, а не $proxy_add_x_forwarded_for: тот дописывает адрес к заголовку,
    # который прислал сам клиент, и приложение считало бы подделку настоящим IP.
    location /api/estimate {
        proxy_pass http://frontend:3000/api/estimate;
        limit_req zone=estimate burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Only /api/auth/session is a Next.js route (cookie management).
    # All other /api/auth/* routes (login, register, me, oauth) go to FastAPI backend.
    location /api/auth/session {
        proxy_pass http://frontend:3000/api/auth/session;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/payments/ {
        proxy_pass http://frontend:3000/api/payments/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Публичная загрузка брифа с формы сметы (backend FastAPI, upload.py: файл до 10 МБ).
    # Префикс ^~, а не точное совпадение: вариант с косой чертой (/api/upload/brief/) и
    # прочие продолжения пути иначе попали бы в админский блок ниже и получили его 100M.
    # Длиннее префикса /api/upload/, поэтому выигрывает у него. 11m = 10 МБ файла + запас
    # на служебные части multipart. limit_req срабатывает до чтения тела: лишние попытки
    # отбиваются без буферизации.
    location ^~ /api/upload/brief {
        proxy_pass http://backend:8000/api/upload/brief;
        limit_req zone=brief_upload burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 11m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Загрузки админки (backend FastAPI): картинки до 10 МБ, видео до 50 МБ, поэтому тело
    # до 100M. Это единственное место с таким лимитом, и оно открыто из интернета: токен
    # проверяет только FastAPI, после приёма тела. Поэтому здесь три ограничения, и ни одно
    # не мешает админу: запрос без Authorization отбивается сразу (см. map выше), частота
    # и число одновременных загрузок с одного IP ограничены с запасом над лимитом бэкенда
    # (10 в минуту). Отсев смотрит только на наличие заголовка, поэтому цену атаки он
    # снижает, а не убирает: убирает только проверка токена до приёма тела.
    # proxy_pass стоит до блока if: тесты api-routing читают тело локации до первой }.
    location /api/upload/ {
        proxy_pass http://backend:8000/api/upload/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
        limit_req zone=upload burst=20 nodelay;
        limit_req_status 429;
        limit_conn upload_conn 10;
        limit_conn_status 429;
        # Тот же ответ, что у FastAPI: клиент админки показывает поле detail как есть
        default_type application/json;
        if ($upload_without_token) {
            return 401 '{"detail":"Требуется аутентификация"}';
        }
    }

    # Uploaded file serving (Next.js API route)
    location /api/uploads/ {
        proxy_pass http://frontend:3000/api/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API (all other /api/ routes go to FastAPI)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running API calls
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Загруженные файлы отдаёт фронтенд, а не бэкенд.
    #
    # У FastAPI маршрута /uploads/ нет вообще — ни StaticFiles, ни роутера; он
    # только пишет файлы в том и возвращает пути. Отдаёт их Next.js: том
    # backend/uploads смонтирован в контейнер фронтенда read-only, а rewrite
    # /uploads/:path* -> /api/uploads/:path* объявлен в next.config.ts.
    #
    # ^~ здесь обязателен. Без него regex-локация со списком расширений картинок
    # (ниже) перехватывает .png/.jpg/.svg/.webp — в nginx regex приоритетнее
    # префикса, — и картинки случайно работают, а всё остальное валится в этот
    # блок. Именно так поломка и пряталась: изображения открывались, а видео из
    # админки (/uploads/videos/*.mp4) и брифы с формы сметы (/uploads/briefs/*.pdf)
    # уходили на бэкенд и получали {"detail":"Not Found"}.
    location ^~ /uploads/ {
        proxy_pass http://frontend:3000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Имена файлов — сгенерированные UUID, содержимое по одному пути
        # никогда не меняется, поэтому immutable здесь безопасен.
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Next.js frontend
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Next.js HMR)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Static fonts - long cache
    location /fonts/ {
        proxy_pass http://frontend:3000/fonts/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Static assets (favicon, logo, etc.)
    location ~* \.(svg|png|ico|webp|jpg|jpeg)$ {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Next.js static assets
    location /_next/static/ {
        proxy_pass http://frontend:3000/_next/static/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
}
