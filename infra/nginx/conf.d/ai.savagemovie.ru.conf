# ai.savagemovie.ru: лендинг обучения AI-контенту (статика из sites/ai).
# Каталог на сервере: /var/www/certbot/ai-landing (см. scripts/deploy-ai.sh).
# Форма записи на следующий поток шлёт заявку на /api/lead, дальше она уходит
# в тот же Next.js-роут, что и формы основного сайта, и падает на hello@savagemovie.ru.

# Защита формы от потока заявок: 10 запросов в минуту с одного IP.
# Лимит срабатывает с кодом 429, страница показывает человеку почту для связи.
limit_req_zone $binary_remote_addr zone=ai_lead:1m rate=10r/m;

# Cache-Control по типу файла. Все add_header стоят на уровне server: если задать
# add_header внутри location, nginx отбрасывает заголовки безопасности уровня server.
map $uri $ai_cache_control {
    default                           "";
    /index.html                       "no-cache, must-revalidate";
    ~*\.(webp|jpg|jpeg|png|ico|svg)$  "public, immutable";
    ~*\.(mp4|webm|mov)$               "public";
}

# Всё, что пришло не на наши имена (голый IP, чужие домены, сканеры), сайта не получает.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    server_name ai.savagemovie.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / { return 301 https://ai.savagemovie.ru$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ai.savagemovie.ru;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/ai.savagemovie.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.savagemovie.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/certbot/ai-landing;
    index index.html;
    charset utf-8;

    # Заголовки безопасности. Скрипты и стили страницы встроены в HTML, поэтому 'unsafe-inline';
    # шрифты, картинки и видео свои, внешних запросов у страницы нет.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'" always;
    add_header Cache-Control $ai_cache_control always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Заявка из формы записи. Роут Next.js указан явно: без него запрос ушёл бы
    # в catch-all страницы и вернул HTML вместо JSON.
    location = /api/lead {
        limit_except POST { deny all; }
        limit_req zone=ai_lead burst=6 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;

        proxy_pass http://frontend:3000/api/contact;
        proxy_set_header Host savagemovie.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
    }

    location ~* \.(webp|jpg|jpeg|png|ico|svg)$ {
        expires 30d; access_log off;
    }

    location ~* \.(mp4|webm|mov)$ {
        expires 30d; access_log off;
    }

    location / { try_files $uri $uri/ /index.html; }

    location ~ /\.(?!well-known) { deny all; }
}
